<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserted Data - Resource Management</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
        }
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #fff;
            color: #1e293b;
            outline: none;
            cursor: pointer;
        }
        .filter-select:focus {
            border-color: #3b82f6;
        }
        .platform-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            padding: 4px;
        }
        .platform-logo svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="brand">
                <div class="brand-icon">R</div>
                <h1>Resource Management System</h1>
            </div>
            <div class="nav-links">
                <a href="/">Submit Form</a>
                <a href="/list" class="active">Inserted Data</a>
                <a href="/docs" target="_blank">Swagger Docs</a>
                <a href="/redoc" target="_blank">ReDoc</a>
            </div>
        </div>
    </header>

    <div class="container-fluid" style="padding-top: 10px;">
        <div class="card">
            <div class="card-header" style="flex-direction: column; align-items: stretch; gap: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <h2>Inserted Resources</h2>
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Search resources...">
                    </div>
                </div>

                <!-- Filters & Sort Bar -->
                <div class="filter-bar">
                    <div>
                        <label for="platformFilter" style="font-size: 0.85rem; font-weight: 600; color: #475569; margin-right: 4px;">Platform:</label>
                        <select id="platformFilter" class="filter-select">
                            <option value="">All Platforms</option>
                            <option value="Telegram">Telegram</option>
                            <option value="Twitter">Twitter</option>
                            <option value="Instagram">Instagram</option>
                            <option value="YouTube">YouTube</option>
                            <option value="Discord">Discord</option>
                        </select>
                    </div>

                    <div>
                        <label for="statusFilter" style="font-size: 0.85rem; font-weight: 600; color: #475569; margin-right: 4px;">Status:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="done">Done</option>
                            <option value="error">Error</option>
                        </select>
                    </div>

                    <div>
                        <label for="sortSelect" style="font-size: 0.85rem; font-weight: 600; color: #475569; margin-right: 4px;">Sort By:</label>
                        <select id="sortSelect" class="filter-select">
                            <option value="created_at:desc">Created Date (Newest)</option>
                            <option value="created_at:asc">Created Date (Oldest)</option>
                            <option value="platform:asc">Platform (A-Z)</option>
                            <option value="status:asc">Status</option>
                            <option value="username:asc">Username (A-Z)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="full-screen-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Platform</th>
                            <th>Type</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Process Time</th>
                            <th>Created Date</th>
                            <th>Log</th>
                        </tr>
                    </thead>
                    <tbody id="resourceLogsTable">
                        <tr><td colspan="8">Loading inserted resources...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Bar -->
            <div class="pagination-container">
                <div class="pagination-info">
                    Showing <span id="showingStart">0</span> to <span id="showingEnd">0</span> of <span id="totalItems">0</span> items
                    (Page <span id="currentPage">1</span> of <span id="totalPages">1</span>)
                </div>

                <div class="pagination-controls">
                    <label for="pageSizeSelect" style="margin-right: 5px;">Per page:</label>
                    <select id="pageSizeSelect" class="pageSize-select">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>

                    <button id="prevBtn" class="pagination-btn" disabled>&laquo; Previous</button>
                    <button id="nextBtn" class="pagination-btn" disabled>Next &raquo;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentPageSize = 10;
        let searchTimeout = null;

        const platformLogos = {
            'Telegram': `<div class="platform-logo" title="Telegram" style="background:#229ED9;"><svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg></div>`,
            'Twitter': `<div class="platform-logo" title="Twitter" style="background:#1DA1F2;"><svg viewBox="0 0 24 24" fill="white"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.05c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 01-1.93.07 4.28 4.28 0 004 2.98 8.521 8.521 0 01-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/></svg></div>`,
            'Instagram': `<div class="platform-logo" title="Instagram" style="background:linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);"><svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></div>`,
            'YouTube': `<div class="platform-logo" title="YouTube" style="background:#FF0000;"><svg viewBox="0 0 24 24" fill="white"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></div>`,
            'Discord': `<div class="platform-logo" title="Discord" style="background:#5865F2;"><svg viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></div>`
        };

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const d = new Date(dateStr);
            return d.toLocaleString();
        }

        function renderTable(items, page, pageSize) {
            const tbody = document.getElementById('resourceLogsTable');
            if (!items || items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #64748b; padding: 20px;">No matching resources found.</td></tr>';
                return;
            }
            tbody.innerHTML = items.map((l, idx) => {
                const globalIndex = (page - 1) * pageSize + idx;
                const logoHtml = platformLogos[l.platform] || `<span class="badge" style="background:#e2e8f0; color:#334155;">${l.platform}</span>`;
                const statusClass = l.status === 'done' ? 'badge-done' : (l.status === 'error' ? 'badge-error' : 'badge-pending');
                const processTime = l.process_time !== null ? l.process_time + 's' : 'None';
                const logDisplay = l.log ? `<pre class="log-output">${l.log}</pre>` : '<span style="color: #94a3b8; font-style: italic;">Empty</span>';
                return `
                    <tr>
                        <td><strong>${globalIndex}</strong></td>
                        <td>${logoHtml}</td>
                        <td>${l.type}</td>
                        <td>${l.username}</td>
                        <td><span class="badge ${statusClass}">${l.status}</span></td>
                        <td>${processTime}</td>
                        <td style="white-space: nowrap; font-size: 0.85rem; color: #475569;">${formatDate(l.created_at)}</td>
                        <td>${logDisplay}</td>
                    </tr>
                `;
            }).join('');
        }

        async function fetchResourceLogs() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            const platformVal = document.getElementById('platformFilter').value;
            const statusVal = document.getElementById('statusFilter').value;
            const sortVal = document.getElementById('sortSelect').value;

            const [sortBy, sortOrder] = sortVal.split(':');

            const params = new URLSearchParams({
                page: currentPage,
                page_size: currentPageSize,
                sort_by: sortBy,
                sort_order: sortOrder
            });

            if (searchTerm) params.append('search', searchTerm);
            if (platformVal) params.append('platform', platformVal);
            if (statusVal) params.append('status', statusVal);

            try {
                const res = await fetch(`/api/resources?${params.toString()}`);
                const data = await res.json();

                renderTable(data.items, data.page, data.page_size);

                // Update pagination controls
                document.getElementById('totalItems').textContent = data.total;
                document.getElementById('currentPage').textContent = data.page;
                document.getElementById('totalPages').textContent = data.total_pages;

                const start = data.total === 0 ? 0 : (data.page - 1) * data.page_size + 1;
                const end = Math.min(data.page * data.page_size, data.total);
                document.getElementById('showingStart').textContent = start;
                document.getElementById('showingEnd').textContent = end;

                document.getElementById('prevBtn').disabled = data.page <= 1;
                document.getElementById('nextBtn').disabled = data.page >= data.total_pages;
            } catch (err) {
                console.error('Failed to fetch resources from API:', err);
                document.getElementById('resourceLogsTable').innerHTML =
                    '<tr><td colspan="8" style="text-align: center; color: #ef4444;">Failed to load data from server.</td></tr>';
            }
        }

        // Debounced search
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentPage = 1;
                fetchResourceLogs();
            }, 300);
        });

        // Filter events
        document.getElementById('platformFilter').addEventListener('change', () => {
            currentPage = 1;
            fetchResourceLogs();
        });

        document.getElementById('statusFilter').addEventListener('change', () => {
            currentPage = 1;
            fetchResourceLogs();
        });

        document.getElementById('sortSelect').addEventListener('change', () => {
            currentPage = 1;
            fetchResourceLogs();
        });

        // Page size selection
        document.getElementById('pageSizeSelect').addEventListener('change', (e) => {
            currentPageSize = parseInt(e.target.value, 10);
            currentPage = 1;
            fetchResourceLogs();
        });

        // Previous button
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                fetchResourceLogs();
            }
        });

        // Next button
        document.getElementById('nextBtn').addEventListener('click', () => {
            currentPage++;
            fetchResourceLogs();
        });

        // Initial load
        fetchResourceLogs();
    </script>
</body>
</html>
