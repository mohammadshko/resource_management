<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserted Data - Resource Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Resource Management System</h1>
            <div class="nav-links">
                <a href="/">Submit Form</a>
                <a href="/list">Inserted Data</a>
                <a href="/docs" target="_blank">Swagger Docs</a>
                <a href="/redoc" target="_blank">ReDoc</a>
            </div>
        </header>

        <div style="max-width: 900px; margin: 0 auto;">
            <!-- Inserted Resources List -->
            <div class="card">
                <h2>Inserted Resources</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Platform</th>
                            <th>Type</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Process Time</th>
                            <th>Log</th>
                        </tr>
                    </thead>
                    <tbody id="resourceLogsTable">
                        <tr><td colspan="7">Loading inserted resources...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchResourceLogs() {
            try {
                const res = await fetch('/api/resources');
                const logs = await res.json();
                const tbody = document.getElementById('resourceLogsTable');
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No resources inserted yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = logs.map(l => {
                    const statusClass = l.status === 'done' ? 'badge-done' : (l.status === 'error' ? 'badge-error' : 'badge-pending');
                    const processTime = l.process_time !== null ? l.process_time + 's' : 'None';
                    const logDisplay = l.log ? `<pre class="log-output">${l.log}</pre>` : '<span style="color: #888; font-style: italic;">Empty</span>';
                    return `
                        <tr>
                            <td>#${l.id}</td>
                            <td><strong>${l.platform}</strong></td>
                            <td>${l.type}</td>
                            <td>${l.username}</td>
                            <td><span class="badge ${statusClass}">${l.status}</span></td>
                            <td>${processTime}</td>
                            <td>${logDisplay}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to fetch resource logs:', err);
            }
        }

        fetchResourceLogs();
    </script>
</body>
</html>
