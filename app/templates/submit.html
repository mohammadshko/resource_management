<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Resource - Resource Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Resource Management System</h1>
            <div class="nav-links">
                <a href="/">Submit Form</a>
                <a href="/list">Inserted Data</a>
                <a href="/docs" target="_blank">Swagger Docs</a>
                <a href="/redoc" target="_blank">ReDoc</a>
            </div>
        </header>

        <div style="max-width: 600px; margin: 0 auto;">
            <div class="card">
                <h2>Submit New Resource</h2>
                <div id="alertBox" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: 600;"></div>
                <form id="resourceForm">
                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <select id="platform" name="platform" required>
                            <option value="" disabled selected>Select a platform</option>
                            <option value="Telegram">Telegram</option>
                            <option value="Twitter">Twitter</option>
                            <option value="Instagram">Instagram</option>
                            <option value="YouTube">YouTube</option>
                            <option value="Discord">Discord</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="type">Resource Type</label>
                        <select id="type" name="type" required>
                            <option value="" disabled selected>Select resource type</option>
                            <option value="channel">channel</option>
                            <option value="group">group</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="username">Username / Identifier</label>
                        <input type="text" id="username" name="username" placeholder="e.g. dev_channel_123" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Submit Resource</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const platform = document.getElementById('platform').value;
            const type = document.getElementById('type').value;
            const username = document.getElementById('username').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await fetch('/api/resources', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ platform, type, username })
                });

                if (res.ok) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#d4edda';
                    alertBox.style.color = '#155724';
                    alertBox.textContent = `Successfully submitted resource for ${username} on ${platform}!`;
                    document.getElementById('resourceForm').reset();
                } else {
                    const errData = await res.json();
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#f8d7da';
                    alertBox.style.color = '#721c24';
                    alertBox.textContent = `Error: ${JSON.stringify(errData.detail || 'Submission failed')}`;
                }
            } catch (err) {
                console.error('Submit error:', err);
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = '#f8d7da';
                alertBox.style.color = '#721c24';
                alertBox.textContent = 'Network or server error occurred.';
            }
        });
    </script>
</body>
</html>
